[dependencies]
numpy = "*"
cython = "*"
openssl = ">=3, <3.6"
pyshp = "*"
h5py = "*"
uv = ">=0.4"
pandas = "*"
scipy = "*"

    [dependencies.python]
    version = ">=3.10.2,<4, >=3.10,!=3.14.0,!=3.14.1,<4"
    build = "*cp*"
    channel = "conda-forge"

    [dependencies.libpython]
    version = "*"
    channel = "conda-forge"

[pypi-dependencies]
chaosmagpy = "*"
hdf5storage = "*"

[workspace]
name = ".CondaPkg"
description = "automatically generated by CondaPkg.jl"
platforms = ["win-64"]
channel-priority = "strict"
channels = ["conda-forge"]
